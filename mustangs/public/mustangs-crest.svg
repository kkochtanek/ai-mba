    <path d="M120 36 l2.4 5 5.5 0.7 -4 3.9 0.9 5.5 -4.8-2.6 -4.8 2.6 0.9-5.5 -4-3.9 5.5-0.7z"/>
    <path d="M143 42 l2.2 4.6 5 0.7 -3.6 3.5 0.9 5 -4.5 -2.4 -4.5 2.4 0.9-5 -3.6-3.5 5-0.7z"/>
  </g>

  <!-- horse head + neck silhouette, facing right, local box ~0-110 x 0-150 -->
  <g transform="translate(58,40) scale(0.9)">
    <path fill="#eef1f4" d="
      M100,68
      C97,55 92,44 82,25
      C75,14 71,10 68,10
      C66,4 62,-10 54,-12
      C50,-6 48,0 46,6
      C42,2 36,2 32,6
      C36,10 40,12 44,12
      C34,16 26,22 16,45
      C10,60 7,80 6,105
      C6,116 8,124 10,130
      C18,134 28,137 34,138
      C36,126 40,112 42,98
      C43,90 44,85 44,80
      C46,82 47,84 48,84
      C52,86 55,85 58,84
      C65,84 72,82 78,80
      C84,77 90,72 100,68
      Z
    "/>
    <!-- mane ridge along the back edge only -->
    <path fill="#0d1f40" d="
